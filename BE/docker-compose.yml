services:
  db:
    image: postgres:18-alpine
    container_name: fullstack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fullstack_dev
    # Host port 5433: 5432 is already taken by the ticketing-system project.
    ports:
      - "5433:5432"
    # Postgres 18+ images want a single mount at /var/lib/postgresql, not at
    # /var/lib/postgresql/data — data lands in a version-named subdirectory so
    # that "pg_upgrade --link" can work across mount boundaries.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fullstack_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
