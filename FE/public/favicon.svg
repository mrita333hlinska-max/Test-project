<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Monogram favicon, drawn to match the app's @theme tokens.

    The letters are stroked line segments, not <text>: a favicon is rendered
    outside the page, so it cannot use a webfont, and font-family would fall
    back to whatever the OS happens to have. Straight strokes look identical
    everywhere and stay crisp when the browser scales this down to 16px.
  -->
  <rect width="64" height="64" rx="14" fill="oklch(52% 0.055 215)" />
  <g
    fill="none"
    stroke="oklch(98.5% 0.004 95)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M12 46V18l9 12 9-12v28" />
    <path d="M38 18v28M52 18v28M38 32h14" />
  </g>
</svg>
